<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Harek Mall</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/cart.css"><link rel="stylesheet" href="/css/responsive.css"></head><body><header class="site-header"><div class="container header-content"><a class="logo" href="/">Harek<span>Mall</span></a><div class="header-actions"><span aria-label="Secure checkout">🔒</span></div></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumb"><a href="/cart">Cart</a><span>/</span><span>Checkout</span></div><h1>Secure checkout</h1><p>Almost there — tell us where to deliver your order.</p></div></section><section class="checkout-section"><div class="container checkout-layout"><form id="checkout-form"><section class="checkout-card"><h2>Delivery address</h2><div class="form-row"><div class="form-field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div><div class="form-field"><label for="phone">Phone number</label><input id="phone" name="phone" inputmode="tel" required></div></div><div class="form-field"><label for="address">Address</label><textarea id="address" name="address" rows="3" required></textarea></div><div class="form-row"><div class="form-field"><label for="city">City</label><input id="city" name="city" required></div><div class="form-field"><label for="pincode">PIN code</label><input id="pincode" name="pincode" inputmode="numeric" required></div></div></section><section class="checkout-card"><h2>Payment method</h2><label class="payment-option"><input type="radio" name="payment" value="cod" checked> Cash on delivery</label><label class="payment-option"><input type="radio" name="payment" value="upi"> UPI / card (demo)</label></section><button class="button button-primary" style="width:100%" type="submit">Place order securely</button></form><aside class="order-summary"><h2>Your order</h2><div id="checkout-items" class="order-lines"></div><div class="summary-row summary-total"><span>Total</span><strong id="checkout-total">₹0</strong></div></aside></div></section></main><script src="/js/data.js"></script><script src="/js/main.js"></script><script src="/js/checkout.js"></script></body></html>
